<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - LovaCRM</title>
    <link rel="icon" type="image/png" href="/static/images/fav1.png">
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background: linear-gradient(108deg, #2CAB5C 0%, #11998E 100%);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 600px;
        }
        .error-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .error-button {
            background: white;
            color: #2CAB5C;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .error-button:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-title">Greška</div>
        <div class="error-message">{{ error }}</div>
        <a href="/login" class="error-button">Povratak na login</a>
    </div>
</body>
</html>
