<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prijava - LOVACRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      font-family: 'Manrope', system-ui, sans-serif;
      background: linear-gradient(108deg, #2CAB5C 0%, #11998E 100%);
      color: white;
    }
    
    .frame {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Слой фонового изображения поверх градиента, под контентом */
    .bg-graphic {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('/static/images/vektora_login.PNG');
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      z-index: 0; /* над градиентом body, под .canvas */
      pointer-events: none;
    }
    
    .lines-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }
    
    .lines-container svg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Позиционирование каждой линии */
    .lines-container svg:nth-child(1) { top: 0; }
    .lines-container svg:nth-child(2) { top: 25%; }
    .lines-container svg:nth-child(3) { top: 74%; }
    .lines-container svg:nth-child(4) { top: 0; }
    
    .canvas {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="frame">
      <div class="bg-graphic"></div>
    
    <!-- Форма в отдельном контейнере -->
    <div class="canvas">
      {% block content %}{% endblock %}
    </div>
  </div>
  </div>
</body>
</html>
